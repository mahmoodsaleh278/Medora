<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>جارِ التحويل...</title>
    <script>
      /* ====== GitHub Pages SPA fallback (404.html) ======
         GitHub Pages ما بيقدر يعمل server-side rewrite، فأي رابط مباشر مثل
         medora-academy.com/courses بيطلع 404 لأنه ملف فعلي اسمه "courses"
         مش موجود. GitHub Pages بيعرض هذا الملف (404.html) تلقائيًا بدل ذلك،
         وهون بنحوّل الطلب إلى index.html مع تشفير المسار الأصلي كـ query
         string، وindex.html بيفك التشفير ويرجّع المسار الصحيح فورًا
         (السكربت المضاف بأعلى <head> في index.html).

         pathSegmentsToKeep:
         - دومين مخصص (custom domain) مثل medora-academy.com على الجذر
           مباشرة → اتركها 0 (هذا هو وضعك الحالي على الأغلب).
         - لو الموقع شغّال على username.github.io/repo-name بدون دومين
           مخصص → غيّرها إلى 1. */
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
